<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>lru-fs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2a44"/>
      <stop offset="1" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="ram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec8f2"/>
      <stop offset="1" stop-color="#2f7fd8"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8eef9"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- RAM module -->
  <g transform="translate(106 92)">
    <rect x="0" y="0" width="300" height="104" rx="14" fill="url(#ram)"/>
    <g fill="#7a3a12" opacity="0.55">
      <rect x="26" y="22" width="44" height="44" rx="6"/>
      <rect x="90" y="22" width="44" height="44" rx="6"/>
      <rect x="166" y="22" width="44" height="44" rx="6"/>
      <rect x="230" y="22" width="44" height="44" rx="6"/>
    </g>
    <path d="M144 104 v-14 a6 6 0 0 1 12 0 v14 z" fill="#0f1626"/>
    <g fill="#ffe2b3">
      <rect x="16" y="84" width="10" height="20"/><rect x="36" y="84" width="10" height="20"/>
      <rect x="56" y="84" width="10" height="20"/><rect x="76" y="84" width="10" height="20"/>
      <rect x="96" y="84" width="10" height="20"/><rect x="116" y="84" width="10" height="20"/>
      <rect x="174" y="84" width="10" height="20"/><rect x="194" y="84" width="10" height="20"/>
      <rect x="214" y="84" width="10" height="20"/><rect x="234" y="84" width="10" height="20"/>
      <rect x="254" y="84" width="10" height="20"/><rect x="274" y="84" width="10" height="20"/>
    </g>
  </g>

  <!-- disk -->
  <g transform="translate(126 318)">
    <path d="M0 26 v74 a130 26 0 0 0 260 0 v-74" fill="url(#disk)"/>
    <ellipse cx="130" cy="26" rx="130" ry="26" fill="#9fe0fa"/>
    <path d="M0 64 a130 26 0 0 0 260 0" fill="none" stroke="#1d5aa6" stroke-width="5" opacity="0.6"/>
    <circle cx="226" cy="106" r="7" fill="#d9f4ff"/>
  </g>

  <!-- LRU: cold goes down, hot comes back up -->
  <path d="M184 218 C150 256, 150 276, 180 300" fill="none" stroke="#e8eef9" stroke-width="14" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M332 314 C362 286, 362 266, 332 230" fill="none" stroke="#e8eef9" stroke-width="14" stroke-linecap="round" marker-end="url(#head)"/>

  <!-- wipe clock -->
  <g transform="translate(256 266)">
    <circle r="34" fill="#0f1626" stroke="#e8eef9" stroke-width="8"/>
    <path d="M0 -18 V0 L13 9" fill="none" stroke="#ffb347" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
